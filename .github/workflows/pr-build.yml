name: PR build validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pr-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify all 29 article routes were generated
        run: |
          count=$(find dist -type f -name index.html | wc -l)
          echo "Generated HTML pages: $count"
          test "$count" -eq 29
