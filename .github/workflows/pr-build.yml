name: PR build validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'src/pages.json'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - 'astro.config.mjs'
      - '.github/workflows/pr-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      - name: Verify all registered routes were generated without dropping base routes
        run: |
          git fetch --no-tags --depth=1 origin main
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, statSync } from 'node:fs';
          import { join } from 'node:path';

          const base = JSON.parse(execFileSync('git', ['show', 'origin/main:src/pages.json'], { encoding: 'utf8' }));
          const pages = JSON.parse(readFileSync('src/pages.json', 'utf8'));
          const basePaths = new Set(base.map(page => page.path));
          const pagePaths = pages.map(page => page.path);
          const uniquePaths = new Set(pagePaths);
          const addedPaths = [...uniquePaths].filter(route => !basePaths.has(route));
          const expectedCount = base.length + addedPaths.length;
          const missingBase = [...basePaths].filter(route => !uniquePaths.has(route));
          const outputFiles = execFileSync('find', ['dist', '-type', 'f', '-name', 'index.html'], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          const outputCount = outputFiles.length;
          const missingOutput = pages.filter(page => {
            const output = join('dist', page.path === '/' ? '' : page.path.slice(1), 'index.html');
            try { return !statSync(output).isFile(); } catch { return true; }
          }).map(page => page.path);

          console.log(`Base routes: ${base.length}; added routes: ${addedPaths.length}; expected output: ${expectedCount}; registered: ${pages.length}; generated: ${outputCount}`);
          if (uniquePaths.size !== pagePaths.length) throw new Error('Duplicate route paths exist in src/pages.json');
          if (missingBase.length) throw new Error(`Base routes were removed: ${missingBase.join(', ')}`);
          if (pages.length !== expectedCount) throw new Error(`Route count should be ${expectedCount} (base routes plus additions), got ${pages.length}`);
          if (outputCount !== expectedCount) throw new Error(`Generated HTML count should be ${expectedCount}, got ${outputCount}`);
          if (missingOutput.length) throw new Error(`Generated files are missing: ${missingOutput.join(', ')}`);
          NODE

  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run verify
      - name: Serve built site
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/siamtefl-http.log 2>&1 &
          echo $! > /tmp/siamtefl-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/teaching-english-thailand-after-40/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/siamtefl-http.log
          exit 1
      - name: Run desktop and mobile browser QA
        run: npx playwright test tests/age-40-browser.spec.js tests/no-replies-article.spec.js tests/provider-outbound-analytics.spec.js
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: age-40-hero-browser-qa-screenshots
          path: test-results/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
