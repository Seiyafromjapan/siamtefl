name: PR build validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pr-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Verify all registered routes were generated
        run: |
          count=$(find dist -type f -name index.html | wc -l)
          expected=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src/pages.json', 'utf8')).length)")
          echo "Generated HTML pages: $count (expected $expected)"
          test "$count" -eq "$expected"
