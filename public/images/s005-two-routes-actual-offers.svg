<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc"><title id="title">Two routes to actual teaching offers</title><desc id="desc">Direct applications and agency or placement create separate routes toward offers. Compare the actual offers, not the route labels.</desc><rect width="1400" height="660" fill="#f6f3ea"/><path d="M0 0h1400v14H0z" fill="#c89a42"/><text x="82" y="92" fill="#173d39" font-family="Georgia,serif" font-size="46">Two routes. One decision.</text><text x="84" y="132" fill="#5e6d65" font-family="Arial,sans-serif" font-size="20" letter-spacing="1.4">FIND OPTIONS, THEN COMPARE THE TERMS</text><rect x="82" y="184" width="510" height="112" rx="8" fill="#173d39"/><text x="122" y="232" fill="#e0bd70" font-family="Arial,sans-serif" font-weight="700" font-size="19" letter-spacing="2">ROUTE 01</text><text x="122" y="270" fill="#fffdf8" font-family="Georgia,serif" font-size="31">Direct applications</text><rect x="808" y="184" width="510" height="112" rx="8" fill="#173d39"/><text x="848" y="232" fill="#e0bd70" font-family="Arial,sans-serif" font-weight="700" font-size="19" letter-spacing="2">ROUTE 02</text><text x="848" y="270" fill="#fffdf8" font-family="Georgia,serif" font-size="31">Agency / placement</text><path d="M337 308v50h286v56M1063 308v50H777v56" fill="none" stroke="#b98a32" stroke-width="4"/><circle cx="337" cy="357" r="8" fill="#b98a32"/><circle cx="1063" cy="357" r="8" fill="#b98a32"/><rect x="480" y="414" width="440" height="88" rx="5" fill="#eee5d0" stroke="#d7c9a8" stroke-width="2"/><text x="700" y="451" text-anchor="middle" fill="#173d39" font-family="Arial,sans-serif" font-weight="700" font-size="18" letter-spacing="2">GATHER</text><text x="700" y="482" text-anchor="middle" fill="#173d39" font-family="Georgia,serif" font-size="28">Actual written offers</text><path d="M700 504v48" stroke="#b98a32" stroke-width="4"/><path d="M690 542l10 14 10-14" fill="none" stroke="#b98a32" stroke-width="4"/><text x="700" y="603" text-anchor="middle" fill="#173d39" font-family="Georgia,serif" font-weight="700" font-size="32">COMPARE THE TERMS</text><text x="700" y="635" text-anchor="middle" fill="#5e6d65" font-family="Arial,sans-serif" font-size="17">employer · pay · paid months · hours · support · exit terms</text></svg>