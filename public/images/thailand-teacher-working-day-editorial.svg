<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Between the bell and the last light</title><desc id="desc">Original editorial illustration of a teacher in a Thai school corridor at late afternoon, with classroom doors, a distant temple roof, tropical plants and two clocks representing classroom periods and campus presence.</desc>
