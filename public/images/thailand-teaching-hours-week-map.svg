<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">The missing hours: an illustrative week at a Thai school</title>
<desc id="desc">Original graphic: 18 fifty-minute teaching periods total 15 hours. A hypothetical eight-hour day across five days totals 40 hours on campus, including 15 hours teaching, 5 hours lunch, and 20 hours of other campus time. The 20 hours can contain planning, marking, meetings, supervision or downtime.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f3f3e9"/><stop offset="1" stop-color="#e1e9d9"/></linearGradient><pattern id="lines" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M0 35V0H35" fill="none" stroke="#123d35" stroke-width=".5" opacity=".09"/></pattern></defs>
<rect width="1200" height="660" rx="18" fill="url(#bg)"/><rect width="1200" height="660" rx="18" fill="url(#lines)"/>
<path d="M0 0H1200V8H0Z" fill="#123d35"/><text x="66" y="68" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1d5547" letter-spacing="3">THE HOURS YOU DON'T SEE IN THE JOB AD</text>
<text x="66" y="125" font-family="Georgia,serif" font-size="48" fill="#123d35">One week. Two different numbers.</text>
<text x="66" y="163" font-family="Arial,sans-serif" font-size="20" fill="#566c5e">Illustrative schedule · 18 periods × 50 minutes · Monday–Friday, 8:00–16:00</text>
<!-- upper split cards -->
<rect x="66" y="207" width="510" height="166" rx="10" fill="#123d35"/><text x="98" y="254" font-family="Arial,sans-serif" font-size="16" fill="#c4e879" letter-spacing="2">CLASSROOM CONTACT</text><text x="98" y="333" font-family="Georgia,serif" font-size="76" fill="#fffdf0">15<tspan font-size="27"> hours</tspan></text>
<rect x="594" y="207" width="540" height="166" rx="10" fill="#d6e6d5" stroke="#9bb7a1"/><text x="626" y="254" font-family="Arial,sans-serif" font-size="16" fill="#1d5547" letter-spacing="2">REQUIRED CAMPUS PRESENCE</text><text x="626" y="333" font-family="Georgia,serif" font-size="76" fill="#123d35">40<tspan font-size="27"> hours</tspan></text>
<!-- week ruler -->
<text x="66" y="428" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#123d35">WHAT FILLS THE 40-HOUR CAMPUS WEEK?</text>
<rect x="66" y="449" width="1068" height="78" rx="8" fill="#fff"/><path d="M74 449H459V527H74Q66 527 66 519V457Q66 449 74 449Z" fill="#123d35"/><rect x="459" y="449" width="534" height="78" fill="#88b39c"/><path d="M993 449H1126Q1134 449 1134 457V519Q1134 527 1126 527H993Z" fill="#e8a344"/>
<text x="258" y="497" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">15h · Teaching</text>
<text x="726" y="497" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#173d34">20h · Other campus time</text>
<text x="1064" y="486" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173d34">5h</text><text x="1064" y="507" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#173d34">Lunch</text>
<text x="66" y="565" font-family="Arial,sans-serif" font-size="18" fill="#435c4d">Other time may include preparation, marking, meetings, supervision or unassigned periods.</text>
<path d="M66 585H1134" stroke="#c3d1c1" stroke-width="2"/>
<text x="66" y="616" font-family="Arial,sans-serif" font-size="14" fill="#53685a">NOT A NATIONAL AVERAGE · Hypothetical example, not a legal definition of paid work time.</text>
<text x="1134" y="616" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#123d35" letter-spacing="2">SIAM TEFL</text>
</svg>