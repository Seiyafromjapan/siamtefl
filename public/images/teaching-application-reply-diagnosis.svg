" y="1033" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="650" fill="#19251f"><tspan x="555" dy="-9">Continue to next</tspan><tspan x="555" dy="24">question</tspan></text><path d="M555 1070 V1080 H380 V1099" fill="none" stroke="#1d5547" stroke-width="4"/><path d="M370 1090 L380 1102 L390 1090" fill="#1d5547"/><rect x="40" y="1105" width="680" height="96" rx="18" fill="#ffffff" stroke="#1d5547" stroke-width="3"/><circle cx="86" cy="1153" r="26" fill="#dcece4"/><text x="86" y="1154" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#123d35">5</text><text x="125" y="1154" text-anchor="start" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="650" fill="#19251f">Has enough time passed to follow up?</text><rect x="40" y="1217" width="330" height="98" rx="14" fill="#dcece4" stroke="#dcece4" stroke-width="1"/><rect x="165" y="1227" width="80" height="32" rx="16" fill="#123d35" stroke="#123d35" stroke-width="1"/><text x="205" y="1243" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">NO</text><text x="205" y="1277" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="650" fill="#19251f"><tspan x="205" dy="-9">Wait and track</tspan><tspan x="205" dy="24">your application</tspan></text><rect x="390" y="1217" width="330" height="98" rx="14" fill="#ffffff" stroke="#1d5547" stroke-width="2"/><rect x="515" y="1227" width="80" height="32" rx="16" fill="#1d5547" stroke="#1d5547" stroke-width="1"/><text x="555" y="1243" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">YES</text><text x="555" y="1278" text-anchor="middle" dominant-baseline="middle"