<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1420" viewBox="0 0 760 1420" role="img" aria-labelledby="reply-flow-title reply-flow-desc"><title id="reply-flow-title">Why Aren't Schools Replying?</title><desc id="reply-flow-desc">A yes-or-no flowchart for teaching job applications in Thailand. Each no branch gives an action. Each yes branch continues to the next question. The final answers are wait and track, or send a polite follow-up.</desc><rect width="760" height="1420" rx="24" fill="#f7f7f2"/><rect x="170" y="24" width="420" height="72" rx="36" fill="#123d35" stroke="#123d35" stroke-width="1"/><text x="380" y="60" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">START</text><rect x="40" y="125" width="680" height="96" rx="18" fill="#ffffff" stroke="#1d5547" stroke-width="3"/><circle cx="86" cy="173" r="26" fill="#dcece4"/><text x="86" y="174" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#123d35">1</text><text x="125" y="174" text-anchor="start" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="650" fill="#19251f">Do you meet the job requirements?</text><rect x="40" y="237" width="330" height="98" rx="14" fill="#dcece4" stroke="#dcece4" stroke-width="1"/><rect x="165" y="247" width="80" height="32" rx="16" fill="#123d35" stroke="#123d35" stroke-width="1"/><text x="205" y="263" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">NO</text><text x="205" y="297" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="650" fill="#19251f"><tspan x="205" dy="-9">Target suitable</tspan><tspan x="205" dy="24">vacancies</tspan></text><rect x="390" y="237" width="330" height="98" rx="14" fill="#ffffff" stroke="#1d5547" stroke-width="2"/><rect x="515" y="247" width="80" height="32" rx="16" fill="#1d5547" stroke="#1d5547" stroke-width="1"/><text x="555" y="263" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">YES</text><text x="555" y="298" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="650" fill="#19251f"><tspan x="555" dy="-9">Continue to next</tspan><tspan x="555" dy="24">question</tspan></text><path d="M555 335 V345 H380 V364" fill="none" stroke="#1d5547" stroke-width="4"/><path d="M370 355 L380 367 L390 355" fill="#1d5547"/><rect x="40" y="370" width="680" height="96" rx="18" fill="#ffffff" stroke="#1d5547" stroke-width="3"/><circle cx="86" cy="418" r="26" fill="#dcece4"/><text x="86" y="419" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#123d35">2</text><text x="125" y="419" text-anchor="start" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="650" fill="#19251f">Is your CV clear and relevant?</text><rect x="40" y="482" width="330" height="98" rx="14" fill="#dcece4" stroke="#dcece4" stroke-width="1"/><rect x="165" y="492" width="80" height="32" rx="16" fill="#123d35" stroke="#123d35" stroke-width="1"/><text x="205" y="508" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">NO</text><text x="205" y="551" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#19251f">Improve your CV</text><rect x="390" y="482" width="330" height="98" rx="14" fill="#ffffff" stroke="#1d5547" stroke-width="2"/><rect x="515" y="492" width="80" height="32" rx="16" fill="#1d5547" stroke="#1d5547" stroke-width="1"/><text x="555" y="508" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">YES</text><text x="555" y="543" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="650" fill="#19251f"><tspan x="555" dy="-9">Continue to next</tspan><tspan x="555" dy="24">question</tspan></text><path d="M555 580 V590 H380 V609" fill="none" stroke="#1d5547" stroke-width="4"/><path d="M370 600 L380 612 L390 600" fill="#1d5547"/><rect x="40" y="615" width="680" height="96" rx="18" fill="#ffffff" stroke="#1d5547" stroke-width="3"/><circle cx="86" cy="663" r="26" fill="#dcece4"/><text x="86" y="664" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#123d35">3</text><text x="125" y="664" text-anchor="start" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="650" fill="#19251f">Did you include the requested documents?</text><rect x="40" y="727" width="330" height="98" rx="14" fill="#dcece4" stroke="#dcece4" stroke-width="1"/><rect x="165" y="737" width="80" height="32" rx="16" fill="#123d35" stroke="#123d35" stroke-width="1"/><text x="205" y="753" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">NO</text><text x="205" y="787" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="650" fill="#19251f"><tspan x="205" dy="-9">Complete your</tspan><tspan x="205" dy="24">application</tspan></text><rect x="390" y="727" width="330" height="98" rx="14" fill="#ffffff" stroke="#1d5547" stroke-width="2"/><rect x="515" y="737" width="80" height="32" rx="16" fill="#1d5547" stroke="#1d5547" stroke-width="1"/><text x="555" y="753" text-anchor="middle" dominant-baseline="middle" font-family="Arial, 