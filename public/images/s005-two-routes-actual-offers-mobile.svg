<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1240" viewBox="0 0 900 1240" role="img" aria-labelledby="title desc"><title id="title">Two routes to actual teaching offers</title><desc id="desc">Direct applications and agency or placement lead to actual offers, which you compare by their written terms.</desc><rect width="900" height="1240" fill="#f6f3ea"/><path d="M0 0h900v16H0z" fill="#c89a42"/><text x="60" y="100" fill="#173d39" font-family="Georgia,serif" font-size="53">Two routes. One decision.</text><text x="62" y="151" fill="#5e6d65" font-family="Arial,sans-serif" font-size="27" letter-spacing="1.5">FIND OPTIONS, THEN COMPARE THE TERMS</text><rect x="60" y="208" width="780" height="152" rx="10" fill="#173d39"/><text x="100" y="263" fill="#e0bd70" font-family="Arial,sans-serif" font-weight="700" font-size="25" letter-spacing="2.5">ROUTE 01</text><text x="100" y="324" fill="#fffdf8" font-family="Georgia,serif" font-size="43">Direct applications</text><path d="M450 369v45" stroke="#b98a32" stroke-width="5"/><path d="M438 399l12 17 12-17" fill="none" stroke="#b98a32" stroke-width="5"/><rect x="60" y="430" width="780" height="152" rx="10" fill="#173d39"/><text x="100" y="485" fill="#e0bd70" font-family="Arial,sans-serif" font-weight="700" font-size="25" letter-spacing="2.5">ROUTE 02</text><text x="100" y="546" fill="#fffdf8" font-family="Georgia,serif" font-size="43">Agency / placement</text><path d="M450 591v45" stroke="#b98a32" stroke-width="5"/><path d="M438 621l12 17 12-17" fill="none" stroke="#b98a32" stroke-width="5"/><rect x="120" y="652" width="660" height="150" rx="7" fill="#eee5d0" stroke="#d7c9a8" stroke-width="3"/><text x="450" y="707" text-anchor="middle" fill="#173d39" font-family="Arial,sans-serif" font-weight="700" font-size="24" letter-spacing="2.5">GATHER</text><text x="450" y="765" text-anchor="middle" fill="#173d39" font-family="Georgia,serif" font-size="42">Actual written offers</text><path d="M450 813v70" stroke="#b98a32" stroke-width="5"/><path d="M438 867l12 18 12-18" fill="none" stroke="#b98a32" stroke-width="5"/><text x="450" y="970" text-anchor="middle" fill="#173d39" font-family="Georgia,serif" font-weight="700" font-size="47">COMPARE THE TERMS</text><text x="450" y="1031" text-anchor="middle" fill="#5e6d65" font-family="Arial,sans-serif" font-size="27">employer · pay · paid months · hours</text><text x="450" y="1072" text-anchor="middle" fill="#5e6d65" font-family="Arial,sans-serif" font-size="27">support · exit terms</text></svg>